plugins {
    id 'org.springframework.boot'
    id 'com.epages.restdocs-api-spec'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3"
    }
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // HttpURLConnection은 PATCH 미지원 → HC5로 교체
    implementation 'io.github.openfeign:feign-hc5'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.7.0'
    runtimeOnly 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

openapi3 {
    server = 'https://tc.greenart.n-e.kr'
    title = 'Apartment Complex Service API'
    version = '1.0.0'
    format = 'json'
    outputDirectory = "${rootDir}/swagger-docs"
    outputFileNamePrefix = 'apartment-complex'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
