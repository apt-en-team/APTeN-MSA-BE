server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: apartment-complex-service
  config:
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-jpa.yml
      - optional:classpath:application-kafka-prod.yml
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${COMPLEX_DB_URL}
    username: ${COMPLEX_DB_USERNAME}
    password: ${COMPLEX_DB_PASSWORD}
  cloud:
    openfeign:
      httpclient:
        # HttpURLConnection은 PATCH 미지원 — HC5 클라이언트로 교체
        hc5:
          enabled: true

constants:
  api:
    prefix: /api/apartment-complexes

apten:
  outbox:
    enabled: true
    polling-enabled: false
    cleanup-enabled: true
    cleanup-retention-days: 3
    cleanup-cron: "0 0 3 * * *"

juso:
  api-key: ${JUSO_API_KEY}
  search-url: https://business.juso.go.kr/addrlink/addrLinkApi.do

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://auth-service:80}
