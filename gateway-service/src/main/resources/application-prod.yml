spring:
  main:
    web-application-type: reactive  # Gateway는 WebFlux 기반 — 리액티브 모드 강제 설정
  application:
    name: gateway-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  config:
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-auth.yml
      - optional:classpath:application-redis-prod.yml
      - optional:file:../.env[.properties]
  cloud:
    gateway:
      routes:
        - id: auth-service-auth
          uri: http://auth-service-auth:80
          predicates:
            - Path=/api/auth/**,/login/**,/oauth2/**

        # 단지 공개/관리자/입주민 API는 complex-service로 라우팅한다.
        - id: apartment-complex-service
          uri: http://apartment-complex-service:80
          predicates:
            - Path=/api/admin/master/apartment-complexes/**,/api/admin/apartment-complex/**,/api/resident/apartment-complex/**,/api/apartment-complexes/**

        # MASTER -> MANAGER 생성, MANAGER → ADMIN 생성 API — auth-service로 라우팅
        - id: auth-service-admin
          uri: http://auth-service-admin:80
          predicates:
            - Path=/api/admin/master/managers/**,/api/admin/manager/admins/**

        # 내 계정 조회/수정 API — auth-service로 라우팅
        - id: auth-service-users
          uri: http://auth-service-users:80
          predicates:
            - Path=/api/users/**

        - id: household-service
          uri: http://household-service:80
          predicates:
            - Path=/api/households/**,/api/household-bills/**,/api/admin/households/**,/api/admin/expected-residents/**,/api/admin/household-match-requests/**,/api/admin/household-types/**,/api/admin/building-line-types/**,/api/admin/household-bills/**,/api/admin/household-bill-policies/**
        - id: parking-vehicle-service
          uri: http://parking-vehicle-service:80
          predicates:
            - Path=/parking-vehicles/**,/api/admin/parking-logs,/api/admin/parking-logs/**,/api/admin/parking/**,/api/parking/**

        - id: facility-reservation-service-admin
          uri: http://facility-reservation-service-admin:80
          predicates:
            - Path=/api/admin/facilities,/api/admin/facilities/**,/api/admin/facility-types,/api/admin/facility-types/**,/api/admin/facility-policies,/api/admin/facility-policies/**,/api/admin/gx-programs,/api/admin/gx-programs/**,/api/admin/gx-reservations,/api/admin/gx-reservations/**,/api/admin/reservations,/api/admin/reservations/**,/api/admin/facility-seats,/api/admin/facility-seats/**,/api/admin/facility-usage,/api/admin/facility-usage/**,/api/admin/facility-subscriptions,/api/admin/facility-subscriptions/**

        - id: facility-reservation-service
          uri: http://facility-reservation-service:80
          predicates:
            - Path=/api/facilities,/api/facilities/**,/api/reservations,/api/reservations/**,/api/gx-programs,/api/gx-programs/**,/api/gx-reservations,/api/gx-reservations/**,/facilities/**,/facility-reservations/**,/api/facility-subscriptions,/api/facility-subscriptions/**

        - id: board-service
          uri: http://board-service:80
          predicates:
            - Path=/boards/**,/comments/**,/notices/**,/api/admin/notices/**,/api/admin/boards/**

        - id: notification-service
          uri: http://notification-service:80
          predicates:
            - Path=/api/notifications/**

        - id: notification-service-websocket
          uri: ws://notification-service-websocket:80
          predicates:
            - Path=/ws/notifications,/ws/notifications/**

gateway:
  auth:
    excluded-paths:
      - /api/auth/**
      - /login/**
      - /oauth2/**
      - /api/apartment-complexes/**
    jwt-secret: ${JWT_SECRET_KEY}

server:
  port: ${SERVER_PORT:8080}

cors:
  # 운영 기본 origin은 배포 도메인만 허용하고, 필요 시 CORS_ORIGINS로 교체한다.
  allowed-origins: ${CORS_ORIGINS:https://tc.greenart.n-e.kr}

constants:
  api:
    prefix: /api

  cloud:
    gateway:
      # 4.0.x 버전 Servlet Gateway의 핵심 설정 프리픽스
      server:
        webmvc:
          actuator:
            enabled: true
          cors:
            configurations:
              '[/**]':
                allowed-origins: [ "https://tc.greenart.n-e.kr" ]
                allowed-methods: [ "*" ]
                allowed-headers: [ "*" ]
                allow-credentials: true
                max-age: 3600
