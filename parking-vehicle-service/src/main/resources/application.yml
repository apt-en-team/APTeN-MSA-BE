server:
  port: ${PARKING_SERVER_PORT}

spring:
  application:
    name: parking-vehicle-service
  config:
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-jpa.yml
      - optional:classpath:application-kafka.yml
      - optional:classpath:application-redis.yml
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${PARKING_DB_URL}
    username: ${PARKING_DB_USERNAME}
    password: ${PARKING_DB_PASSWORD}
  kafka:
    consumer:
#      group-id: parking-vehicle-service-group

constants:
  api:
    prefix: /api

apten:
  outbox:
    enabled: true
  scheduler:
    parking-mock:
      enabled: ${APTEN_SCHEDULER_PARKING_MOCK_ENABLED:true}
      fixed-delay-ms: ${APTEN_SCHEDULER_PARKING_MOCK_FIXED_DELAY_MS:7000}
    zone-counter-reconcile:
      enabled: ${APTEN_SCHEDULER_ZONE_COUNTER_RECONCILE_ENABLED:true}
      fixed-delay-ms: ${APTEN_SCHEDULER_ZONE_COUNTER_RECONCILE_FIXED_DELAY_MS:30000}
    visitor-expire:
      enabled: ${APTEN_SCHEDULER_VISITOR_EXPIRE_ENABLED:true}
      cron: ${APTEN_SCHEDULER_VISITOR_EXPIRE_CRON:0 0 0 * * *}
    monthly-visitor-fee:
      enabled: ${APTEN_SCHEDULER_MONTHLY_VISITOR_FEE_ENABLED:true}
      cron: ${APTEN_SCHEDULER_MONTHLY_VISITOR_FEE_CRON:0 0 2 2 * *}
    monthly-vehicle-fee:
      enabled: ${APTEN_SCHEDULER_MONTHLY_VEHICLE_FEE_ENABLED:true}
      cron: ${APTEN_SCHEDULER_MONTHLY_VEHICLE_FEE_CRON:0 0 2 2 * *}
  policy:
    visitor-vehicle:
      expire-grace-days: ${APTEN_POLICY_VISITOR_VEHICLE_EXPIRE_GRACE_DAYS:3}
  sse:
    timeout-ms: ${APTEN_SSE_TIMEOUT_MS:1800000}
    heartbeat-interval-ms: ${APTEN_SSE_HEARTBEAT_INTERVAL_MS:30000}
