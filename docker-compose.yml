services:
  kafka-connect:
    image: quay.io/debezium/connect:2.7
    container_name: apten-kafka-connect
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      # kafka-broker 컨테이너(green-eats-container_default 네트워크)에 연결
      BOOTSTRAP_SERVERS: kafka-broker:9092
      GROUP_ID: apten-connect-group
      # 커넥터 설정/오프셋/상태를 Kafka 내부 토픽에 저장
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # SMT 처리 실패 이벤트를 DLQ 토픽으로 분리
      ERRORS_TOLERANCE: all
      ERRORS_DEADLETTERQUEUE_TOPIC_NAME: outbox-dlq
      ERRORS_DEADLETTERQUEUE_CONTEXT_HEADERS_ENABLE: "true"
    networks:
      # kafka-broker가 속한 외부 네트워크에 연결 (MariaDB는 외부 IP 직접 접근)
      - green-eats-net
    extra_hosts:
      # kafka-broker가 advertised listener로 localhost:9092를 반환하므로
      # 컨테이너 내부에서 localhost → kafka-broker IP로 우회한다.
      - "localhost:172.18.0.2"

  redis:
    image: redis:7-alpine
    container_name: apten-redis
    restart: unless-stopped  # Docker Desktop 시작 시 자동 실행
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes # 재시작해도 데이터 유지
    volumes:
      - redis-data:/data

volumes:
  redis-data:

networks:
  # kafka-broker 컨테이너가 속한 외부 네트워크 — kafka-connect가 브로커에 접근하기 위해 참조
  green-eats-net:
    external: true
    name: green-eats-container_default