services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: apten-kafka
    restart: unless-stopped  # Docker Desktop 시작 시 자동 실행
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_NUM_PARTITIONS: 1
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-connect:
    image: debezium/connect:2.7
    container_name: apten-kafka-connect
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      # 같은 docker network의 kafka 브로커에 연결
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: apten-connect-group
      # 커넥터 설정/오프셋/상태를 Kafka 내부 토픽에 저장
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # SMT 처리 실패 이벤트를 DLQ 토픽으로 분리
      ERRORS_TOLERANCE: all
      ERRORS_DEADLETTERQUEUE_TOPIC_NAME: outbox-dlq
      ERRORS_DEADLETTERQUEUE_CONTEXT_HEADERS_ENABLE: "true"
    depends_on:
      - kafka

  redis:
    image: redis:7-alpine
    container_name: apten-redis
    restart: unless-stopped  # Docker Desktop 시작 시 자동 실행
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes # 재시작해도 데이터 유지
    volumes:
      - redis-data:/data

volumes:
  kafka-data:
  redis-data: