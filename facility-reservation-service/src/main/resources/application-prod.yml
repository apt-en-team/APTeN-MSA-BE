server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: facility-reservation-service
  config:
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-jpa.yml
      - optional:classpath:application-kafka-prod.yml
      - optional:classpath:application-redis-prod.yml
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${FACILITY_DB_URL}
    username: ${FACILITY_DB_USERNAME}
    password: ${FACILITY_DB_PASSWORD}

constants:
  api:
    prefix: /api

apten:
  outbox:
    enabled: true
    polling-enabled: false      # CDC 방식: Debezium binlog 감지로 Kafka 발행. OutboxRelay 비활성.
    cleanup-enabled: true       # Debezium이 row 삭제 안 하므로 보관 기간 초과분 자동 정리.
    cleanup-retention-days: 3   # 3일 이상 된 outbox row 삭제.
    cleanup-cron: "0 0 3 * * *" # 매일 새벽 3시 실행.
  bootstrap:
    facility-type:
      enabled: ${APTEN_BOOTSTRAP_FACILITY_TYPE_ENABLED:false}
  scheduler:
    reservation-complete:
      enabled: ${APTEN_SCHEDULER_RESERVATION_COMPLETE_ENABLED:true}
      fixed-delay-ms: ${APTEN_SCHEDULER_RESERVATION_COMPLETE_FIXED_DELAY_MS:60000}
      batch-size: ${APTEN_SCHEDULER_RESERVATION_COMPLETE_BATCH_SIZE:100}
    gx-complete:
      enabled: ${APTEN_SCHEDULER_GX_COMPLETE_ENABLED:true}
      fixed-delay-ms: ${APTEN_SCHEDULER_GX_COMPLETE_FIXED_DELAY_MS:60000}
      batch-size: ${APTEN_SCHEDULER_GX_COMPLETE_BATCH_SIZE:100}
    gx-approval-reminder:
      enabled: ${APTEN_SCHEDULER_GX_APPROVAL_REMINDER_ENABLED:true}
      cron: ${APTEN_SCHEDULER_GX_APPROVAL_REMINDER_CRON:0 0 9 * * *}
    facility-reminder:
      enabled: ${APTEN_SCHEDULER_FACILITY_REMINDER_ENABLED:true}
      cron: ${APTEN_SCHEDULER_FACILITY_REMINDER_CRON:0 */5 * * * *}
