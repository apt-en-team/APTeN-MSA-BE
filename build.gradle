plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    // Spring Boot 3.3.x (Spring Framework 6.1)와 호환되는 버전
    id 'com.epages.restdocs-api-spec' version '0.19.4' apply false
}

allprojects {
    group = 'com.apten'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.5"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        implementation 'io.github.cdimascio:dotenv-java:3.0.0' // .env 파일 로드 라이브러리

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // openapi3 태스크 완료 후 document-service 정적 리소스 경로로 자동 복사
    tasks.all { task ->
        if (task.name == 'openapi3') {
            task.doLast {
                copy {
                    from "${rootProject.projectDir}/swagger-docs"
                    into "${rootProject.projectDir}/document-service/src/main/resources/static/swagger-docs"
                }
            }
        }
    }
}
