server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: notification-service
  config:
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-jpa.yml
      - optional:classpath:application-kafka-prod.yml
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}

constants:
  api:
    prefix: /api/notifications

apten:
  scheduler:
    notification-cleanup:
      enabled: ${APTEN_SCHEDULER_NOTIFICATION_CLEANUP_ENABLED:true}
      cron: ${APTEN_SCHEDULER_NOTIFICATION_CLEANUP_CRON:0 0 3 * * *}
  notification:
    push:
      fcm-enabled: ${APTEN_NOTIFICATION_PUSH_FCM_ENABLED:false}
      web-base-url: ${APTEN_NOTIFICATION_PUSH_WEB_BASE_URL:https://tc.greenart.n-e.kr}
      firebase:
        credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
        project-id: ${FIREBASE_PROJECT_ID:}
