plugins {
    id 'org.springframework.boot'
    id 'com.epages.restdocs-api-spec'
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // /ws/notifications 순수 WebSocket endpoint를 열기 위한 의존성
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.7.0'
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    runtimeOnly 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

openapi3 {
    server = 'http://localhost:9081'
    title = 'Notification Service API'
    version = '1.0.0'
    format = 'json'
    outputDirectory = "${rootDir}/swagger-docs"
    outputFileNamePrefix = 'notification'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
